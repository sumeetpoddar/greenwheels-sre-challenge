
services:
  # --------------------------------------------------
  # POSTGRESQL DATABASE
  # --------------------------------------------------
  postgres:
    image: postgres:16
    container_name: greenwheels-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------
  # FASTAPI APPLICATION
  # --------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: greenwheels-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------
  # PROMETHEUS MONITORING
  # --------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: greenwheels-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

    depends_on:
      api:
        condition: service_healthy

  # --------------------------------------------------
  # HEALTH PROBE EXPORTER
  # --------------------------------------------------
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: greenwheels-blackbox-exporter
    restart: unless-stopped

    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"

  # --------------------------------------------------
  # ALERTMANAGER (OPTIONAL SLACK NOTIFICATIONS)
  # --------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: greenwheels-alertmanager
    restart: unless-stopped
    profiles:
      - notifications

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.secrets/slack_webhook_url:/run/secrets/slack_webhook_url:ro
      - alertmanager_data:/alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

  # --------------------------------------------------
  # GRAFANA DASHBOARDS
  # --------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: greenwheels-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

# --------------------------------------------------
# PERSISTENT VOLUMES
# --------------------------------------------------
volumes:
  postgres_data:
    name: greenwheels-postgres-data

  prometheus_data:
    name: greenwheels-prometheus-data

  alertmanager_data:
    name: greenwheels-alertmanager-data

  grafana_data:
    name: greenwheels-grafana-data
