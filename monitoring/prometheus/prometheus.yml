
# --------------------------------------------------
# PROMETHEUS GLOBAL CONFIGURATION
# --------------------------------------------------

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_timeout: 10s

# --------------------------------------------------
# RECORDING AND ALERTING RULE FILES
# --------------------------------------------------

rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alerting_rules.yml

# Alertmanager is enabled with the Compose "notifications" profile.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# --------------------------------------------------
# SCRAPE CONFIGURATIONS
# --------------------------------------------------

scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Greenwheels FastAPI application
  - job_name: greenwheels-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          application: greenwheels-lease-service
          environment: local

  # Scrape the blackbox exporter itself.
  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  # Probe the combined API health endpoint, including database readiness.
  - job_name: greenwheels-health
    metrics_path: /probe
    params:
      module:
        - greenwheels_health
    static_configs:
      - targets:
          - http://api:8000/health
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
