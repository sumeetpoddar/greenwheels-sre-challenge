<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Greenwheels service and observability architecture</title>
  <desc id="description">Docker Compose runs the FastAPI service, PostgreSQL, Prometheus, Grafana, and a Blackbox health probe. Alertmanager and Slack notifications are optional.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123b67"/>
      <stop offset="1" stop-color="#176b66"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#18324b" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2874a6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16856b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97824"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #18324b; }
      .title { fill: #fff; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #d9e8f4; font-size: 15px; }
      .card-title { font-size: 19px; font-weight: 700; }
      .small { font-size: 13px; fill: #536b80; }
      .tiny { font-size: 11px; fill: #536b80; }
      .label { font-size: 12px; font-weight: 600; fill: #31536e; }
      .node { filter: url(#shadow); }
      .flow { fill: none; stroke-width: 2.5; }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="18" fill="#f3f7fb"/>
  <rect x="22" y="20" width="1156" height="98" rx="16" fill="url(#header)"/>
  <text x="54" y="61" class="title">Greenwheels | Service &amp; Observability</text>
  <text x="56" y="89" class="subtitle">FastAPI lease service  •  PostgreSQL persistence  •  Prometheus metrics  •  Grafana dashboards</text>

  <rect x="44" y="142" width="1112" height="470" rx="18" fill="#fff" stroke="#c7d7e5" stroke-width="1.5"/>
  <rect x="64" y="132" width="205" height="25" rx="12" fill="#e7eef5"/>
  <text x="78" y="150" font-size="12" font-weight="700" fill="#47647e">DOCKER COMPOSE SERVICES</text>

  <!-- Client -->
  <g class="node">
    <rect x="77" y="275" width="158" height="106" rx="14" fill="#eef5fb" stroke="#a8c4dc" stroke-width="1.5"/>
    <circle cx="115" cy="316" r="20" fill="#d7e8f7"/>
    <path d="M106 316h18M115 307v18M109 310l12 12M121 310l-12 12" stroke="#2874a6" stroke-width="2.3" stroke-linecap="round"/>
    <text x="145" y="310" class="card-title" font-size="16">Client</text>
    <text x="98" y="350" class="small">Lease API requests</text>
    <text x="98" y="369" class="tiny">localhost:8000</text>
  </g>

  <!-- API -->
  <g class="node">
    <rect x="300" y="235" width="245" height="185" rx="16" fill="#e8f6f1" stroke="#60b99e" stroke-width="2"/>
    <rect x="300" y="235" width="245" height="13" rx="7" fill="#16856b"/>
    <text x="324" y="282" class="card-title">Greenwheels API</text>
    <text x="324" y="307" class="small">FastAPI + Python</text>
    <line x1="324" y1="325" x2="520" y2="325" stroke="#bdded3"/>
    <text x="324" y="350" class="small">POST /leases/events</text>
    <text x="324" y="372" class="small">GET /leases/{driver_id}</text>
    <text x="324" y="394" class="small">GET /health  •  /metrics</text>
  </g>

  <!-- PostgreSQL -->
  <g class="node">
    <rect x="77" y="467" width="245" height="105" rx="15" fill="#edf3fb" stroke="#83a7d1" stroke-width="1.7"/>
    <circle cx="116" cy="514" r="23" fill="#d9e6f5"/>
    <ellipse cx="116" cy="506" rx="13" ry="5" fill="none" stroke="#356da5" stroke-width="2"/>
    <path d="M103 506v16c0 3 6 6 13 6s13-3 13-6v-16M103 514c0 3 6 6 13 6s13-3 13-6" fill="none" stroke="#356da5" stroke-width="2"/>
    <text x="153" y="506" class="card-title">PostgreSQL 16</text>
    <text x="153" y="530" class="small">Event log + lease projection</text>
    <text x="153" y="551" class="tiny">localhost:5432 • persistent volume</text>
  </g>

  <!-- Prometheus -->
  <g class="node">
    <rect x="650" y="205" width="235" height="177" rx="16" fill="#fff1e9" stroke="#ed9b70" stroke-width="1.8"/>
    <rect x="650" y="205" width="235" height="13" rx="7" fill="#e66a3c"/>
    <circle cx="690" cy="263" r="20" fill="#ffe0d2"/>
    <path d="M690 246l-10 28h20z" fill="#e66a3c"/>
    <path d="M690 253v12" stroke="#fff" stroke-width="2.5"/>
    <text x="722" y="263" class="card-title">Prometheus</text>
    <text x="674" y="302" class="small">Scrapes /metrics every 15s</text>
    <text x="674" y="325" class="small">Evaluates SLI recording rules</text>
    <text x="674" y="348" class="small">Evaluates alerting rules</text>
    <text x="674" y="369" class="tiny">localhost:9090</text>
  </g>

  <!-- Grafana -->
  <g class="node">
    <rect x="955" y="205" width="166" height="150" rx="16" fill="#f1edfc" stroke="#a99adb" stroke-width="1.8"/>
    <rect x="955" y="205" width="166" height="13" rx="7" fill="#7658b5"/>
    <circle cx="995" cy="263" r="20" fill="#e2daf6"/>
    <path d="M984 264a11 11 0 1 1 6 10M995 252v12l9 5" fill="none" stroke="#7658b5" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1022" y="263" class="card-title">Grafana</text>
    <text x="978" y="303" class="small">Provisioned dashboard</text>
    <text x="978" y="325" class="small">Prometheus datasource</text>
    <text x="978" y="346" class="tiny">localhost:3000</text>
  </g>

  <!-- Blackbox -->
  <g class="node">
    <rect x="650" y="445" width="235" height="112" rx="15" fill="#edf5fc" stroke="#8eb5d7" stroke-width="1.7"/>
    <text x="674" y="480" class="card-title" font-size="17">Blackbox Exporter</text>
    <text x="674" y="506" class="small">Probes GET /health</text>
    <text x="674" y="529" class="small">Checks API + DB readiness</text>
    <text x="674" y="549" class="tiny">Internal service • port 9115</text>
  </g>

  <!-- Alertmanager optional -->
  <g class="node">
    <rect x="955" y="425" width="166" height="116" rx="15" fill="#fff7e8" stroke="#e5bd69" stroke-width="1.7" stroke-dasharray="6 4"/>
    <text x="978" y="462" class="card-title" font-size="16">Alertmanager</text>
    <text x="978" y="486" class="small">Optional profile</text>
    <text x="978" y="508" class="small">Groups / routes alerts</text>
    <text x="978" y="530" class="tiny">localhost:9093 when enabled</text>
  </g>
  <g>
    <rect x="1000" y="558" width="120" height="35" rx="17" fill="#e8f6f1" stroke="#91cdb9"/>
    <circle cx="1019" cy="575" r="8" fill="#16856b"/>
    <path d="M1015 575l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8"/>
    <text x="1034" y="580" font-size="12" font-weight="700" fill="#28715f">Slack (optional)</text>
  </g>

  <!-- Client/API request -->
  <path d="M235 325H292" class="flow" stroke="#2874a6" marker-end="url(#arrow-blue)"/>
  <text x="244" y="309" class="label">HTTP</text>

  <!-- API/Postgres -->
  <path d="M322 420V458" class="flow" stroke="#16856b" marker-end="url(#arrow-green)"/>
  <path d="M338 458V420" class="flow" stroke="#16856b" marker-end="url(#arrow-green)"/>
  <text x="344" y="443" class="label">read / write</text>

  <!-- Prom scrape API -->
  <path d="M545 269H642" class="flow" stroke="#d97824" marker-end="url(#arrow-orange)"/>
  <text x="556" y="250" class="label">scrape /metrics</text>

  <!-- Grafana queries Prometheus -->
  <path d="M947 286H893" class="flow" stroke="#7658b5" marker-end="url(#arrow-blue)"/>
  <text x="890" y="269" class="label">PromQL queries</text>

  <!-- Prometheus probes Blackbox -->
  <path d="M690 390V437" class="flow" stroke="#2874a6" marker-end="url(#arrow-blue)"/>
  <text x="700" y="417" class="label">scrape /probe</text>

  <!-- Blackbox probes API -->
  <path d="M642 500H570Q555 500 555 485V410Q555 397 545 397" class="flow dashed" stroke="#2874a6" marker-end="url(#arrow-blue)"/>
  <text x="445" y="474" class="label">GET /health probe</text>

  <!-- Prometheus to Alertmanager -->
  <path d="M885 347H927Q940 347 940 360V460Q940 473 947 473" class="flow dashed" stroke="#d97824" marker-end="url(#arrow-orange)"/>
  <text x="891" y="393" class="tiny" transform="rotate(90 891 393)">alerts (optional)</text>

  <!-- Alertmanager to Slack -->
  <path d="M1038 541V550" class="flow dashed" stroke="#16856b" marker-end="url(#arrow-green)"/>
  <text x="1045" y="551" class="tiny">webhook secret</text>

  <!-- Bottom notes -->
  <rect x="44" y="635" width="1112" height="92" rx="15" fill="#e9f0f7" stroke="#c2d3e2"/>
  <text x="68" y="665" font-size="15" font-weight="700">Operational notes</text>
  <text x="68" y="690" class="small">• API JSON logs go to container stdout/stderr (view with docker compose logs).</text>
  <text x="68" y="713" class="small">• Slack delivery requires a local ignored webhook secret and the Compose notifications profile.</text>
  <text x="650" y="690" class="small">• Kafka, ECS, RDS, and Redis are design-only;</text>
  <text x="650" y="713" class="small">  they are not part of this running Compose stack.</text>
</svg>
